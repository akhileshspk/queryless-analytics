<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomedical Research AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafafa;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user {
            background: #3498db;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant {
            background: #e9ecef;
            color: #2c3e50;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .system {
            background: transparent;
            color: #7f8c8d;
            font-size: 0.85rem;
            align-self: center;
            text-align: center;
            font-style: italic;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }
        #user-input:focus {
            border-color: #3498db;
        }
        #send-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        #send-btn:hover {
            background: #2980b9;
        }
        #send-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Biomedical AI Assistant</div>
    
    <div id="chat-box">
        <div class="message system">Live Chat enabled. You can converse normally or ask for a hypothesis and action plan.</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask a question or request a novel hypothesis...">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    
    let chatHistory = []; 

    // Send Message Event Listeners
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = '';
        sendBtn.disabled = true;
        sendBtn.innerText = 'Computing...';

        try {
            // Update URL to your secure API endpoint
            const response = await fetch('https://api.qanalytics.in/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    prompt: text, 
                    history: chatHistory 
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                appendMessage(data.response, 'assistant');
                
                // Update history to maintain conversational context
                chatHistory.push({"role": "user", "content": text});
                chatHistory.push({"role": "assistant", "content": data.response});
            } else {
                appendMessage(`Error: ${data.error}`, 'system');
            }
        } catch (error) {
            console.error(error);
            appendMessage("Network error. Could not reach AWS backend.", 'system');
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = 'Send';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function appendMessage(text, role) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
});
</script>

</body>
</html>
